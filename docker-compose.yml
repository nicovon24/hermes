services:
  hermes-payments:
    build: .
    ports:
      - "3000:3000"
    environment:
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-https://arb1.arbitrum.io/rpc}
      REQUIRED_CONFIRMATIONS: ${REQUIRED_CONFIRMATIONS:-1}
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY:-}
      MAX_PAYMENT_BASE_UNITS: ${MAX_PAYMENT_BASE_UNITS:-30000000000000000000000}
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_USDC_MINT: ${SOLANA_USDC_MINT:-}
      SOLANA_AGENT_PRIVATE_KEY: ${SOLANA_AGENT_PRIVATE_KEY:-}
      SOLANA_TEST_MINT_ADDRESS: ${SOLANA_TEST_MINT_ADDRESS:-}
      SOLANA_SETTLEMENT_WALLET: ${SOLANA_SETTLEMENT_WALLET:-}
      SOLANA_SETTLEMENT_TOKEN_ACCOUNT: ${SOLANA_SETTLEMENT_TOKEN_ACCOUNT:-HoRLd2NMNyacgJCCx3NhJTgqPXhKNELbGGigoTZRkYSL}
      SOLANA_SOURCE_WALLET: ${SOLANA_SOURCE_WALLET:-}
      HERMES_INTERNAL_API_KEY: ${HERMES_INTERNAL_API_KEY:-}
