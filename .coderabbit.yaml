reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^frontend$"
      - "^backend$"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_instructions:
    - path: "src/components/**"
      instructions: |
        Keep components presentational. Do not call fetch or server actions directly.
    - path: "src/actions/**"
      instructions: |
        Keep server actions isolated from presentation and preserve the response shape.
    - path: "prisma/**"
      instructions: |
        Do not invent domain models until the negotiation protocol is explicitly defined.
